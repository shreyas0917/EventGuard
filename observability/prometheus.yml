# Scrapes both backend processes inside the Compose network.
# Started with: docker compose --profile observability up -d
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eventguard-api
    metrics_path: /metrics
    # If METRICS_TOKEN is set on the backend, uncomment and use the same value:
    # authorization:
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets: ["backend:3001"]
        labels:
          component: api

  - job_name: eventguard-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9464"]
        labels:
          component: consumer
