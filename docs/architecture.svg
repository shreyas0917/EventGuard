<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="1504" viewBox="0 0 1312 1504" role="img" aria-labelledby="eg-title eg-desc">
  <title id="eg-title">EventGuard system architecture</title>
  <desc id="eg-desc">Clients call the Express API, which writes Event, EventLog and OutboxEvent rows to PostgreSQL in one transaction. The outbox worker publishes pending rows to the Kafka topic eventguard.events. The consumer runs processEvent, which checks a Redis completed cache, takes a Redis lock, claims the event in PostgreSQL and credits the wallet under a unique eventId constraint. Failures are retried by the retry worker with exponential backoff and moved to a dead-letter table after three attempts.</desc>
  <defs>
    <style>
      text { font-family: 'IBM Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 14px; fill: #C3CCD7; }
      .m { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 16px; font-weight: 600; fill: #EEF2F6; }
      .c { font-size: 13px; fill: #E0E6EE; }
      .k { font-size: 12px; fill: #8D9AAB; }
      .mu { fill: #8D9AAB; }
      .zl { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; fill: #8D9AAB; }
      .al { font-size: 13px; fill: #9FAABA; }
      .af { font-size: 13px; fill: #EE8466; }
      .bt { font-size: 12px; font-weight: 600; fill: #1B1405; text-anchor: middle; }
      .zone { fill: #141B24; stroke: #222C3A; stroke-width: 1; }
      .card { fill: #1A2330; stroke: #2E3A4B; stroke-width: 1; }
      .card-ev { fill: #1A2330; stroke: #2A5361; stroke-width: 1; }
      .card-rt { fill: #1A2330; stroke: #5B3B33; stroke-width: 1; }
      .badge { fill: #F0B44C; }
      .an { fill: none; stroke: #7B889A; stroke-width: 2; stroke-linecap: round; }
      .ac { fill: none; stroke: #4CC3D9; stroke-width: 2; stroke-linecap: round; }
      .ar { fill: none; stroke: #EE8466; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 6; }
    </style>
    <marker id="hn" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#7B889A"/></marker>
    <marker id="hc" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#4CC3D9"/></marker>
    <marker id="hr" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#EE8466"/></marker>
  </defs>

  <rect width="1312" height="1504" rx="20" fill="#0E131A"/>

  <!-- Zones -->
  <rect class="zone" x="64.5" y="168.5" width="783" height="159" rx="16"/>
  <rect class="zone" x="64.5" y="376.5" width="783" height="439" rx="16"/>
  <rect class="zone" x="456.5" y="864.5" width="391" height="167" rx="16"/>
  <rect class="zone" x="64.5" y="1080.5" width="783" height="271" rx="16"/>
  <rect class="zone" x="976.5" y="376.5" width="271" height="975" rx="16"/>

  <!-- Arrows -->
  <path class="an" d="M 192 304 L 192 419" marker-end="url(#hn)"/>
  <path class="an" d="M 456 304 L 456 419" marker-end="url(#hn)"/>
  <path class="an" d="M 720 304 L 720 419" marker-end="url(#hn)"/>
  <path class="an" d="M 824 504 L 995 504" marker-end="url(#hn)"/>
  <path class="an" d="M 1000 685 L 829 685" marker-end="url(#hn)"/>
  <path class="an" d="M 824 739 L 995 739" marker-end="url(#hn)"/>
  <path class="ac" d="M 652 792 L 652 907" marker-end="url(#hc)"/>
  <path class="ac" d="M 652 1008 L 652 1123" marker-end="url(#hc)"/>
  <path class="ar" d="M 203 1128 L 203 797" marker-end="url(#hr)"/>
  <path class="ar" d="M 317 792 L 317 1123" marker-end="url(#hr)"/>
  <path class="an" d="M 824 1168 L 995 1168" marker-end="url(#hn)"/>
  <path class="an" d="M 824 1288 L 995 1288" marker-end="url(#hn)"/>

  <!-- Clients -->
  <rect class="card" x="88.5" y="216.5" width="207" height="87" rx="12"/>
  <text x="192" y="254" text-anchor="middle" class="h">Dashboard</text>
  <text x="192" y="275" text-anchor="middle">React 18 · Vite · :5173</text>
  <rect class="card" x="352.5" y="216.5" width="207" height="87" rx="12"/>
  <text x="456" y="254" text-anchor="middle" class="h">Razorpay Checkout</text>
  <text x="456" y="275" text-anchor="middle">Test Mode, in browser</text>
  <rect class="card" x="616.5" y="216.5" width="207" height="87" rx="12"/>
  <text x="720" y="254" text-anchor="middle" class="h">Razorpay webhooks</text>
  <text x="720" y="275" text-anchor="middle">signed, may redeliver</text>

  <!-- Express API -->
  <rect class="card" x="88.5" y="424.5" width="735" height="159" rx="12"/>
  <text x="112" y="465"><tspan class="h">Express API</tspan><tspan class="m k" dx="12" style="font-size: 13px">:3001</tspan></text>
  <text x="112" y="486" class="mu">JWT roles · ownership checks · zod validation · rate limits · request IDs</text>
  <circle class="badge" cx="122" cy="504" r="10"/><text x="122" y="508" class="bt">1</text>
  <text x="140" y="508">Unique <tspan class="m c">eventId</tspan>: Event + EventLog + OutboxEvent in one transaction; duplicate → 409</text>
  <circle class="badge" cx="122" cy="526" r="10"/><text x="122" y="530" class="bt">2</text>
  <text x="140" y="530">Payments: <tspan class="m c">evt_{paymentId}</tspan> + <tspan class="m c">pg_advisory_xact_lock</tspan>, so verify and webhook converge</text>
  <circle class="badge" cx="122" cy="548" r="10"/><text x="122" y="552" class="bt">3</text>
  <text x="140" y="552">Webhooks: HMAC-SHA256 over the raw body; <tspan class="m c">razorpayEventId</tspan> UNIQUE</text>

  <!-- Retry worker -->
  <rect class="card-rt" x="88.5" y="632.5" width="343" height="159" rx="12"/>
  <text x="112" y="673" class="h">Retry + recovery worker</text>
  <text x="112" y="694">due retries · expired leases</text>
  <text x="112" y="716">never-claimed events (sweep)</text>
  <text x="112" y="738">3rd failure → <tspan class="m c">FAILED</tspan> + DLQ row</text>
  <text x="112" y="760">replay: <tspan class="m c">POST /api/dlq/:id/replay</tspan></text>

  <!-- Outbox worker -->
  <rect class="card-ev" x="480.5" y="632.5" width="343" height="159" rx="12"/>
  <text x="504" y="684" class="h">Outbox worker</text>
  <text x="504" y="705">leases 50 <tspan class="m c">PENDING</tspan> rows (SKIP LOCKED)</text>
  <text x="504" y="727">publish to Kafka, then mark <tspan class="m c">PUBLISHED</tspan></text>
  <text x="504" y="749">on error: stays <tspan class="m c">PENDING</tspan>, backoff</text>

  <!-- Kafka -->
  <rect class="card-ev" x="480.5" y="912.5" width="343" height="95" rx="12"/>
  <text x="504" y="954" class="m" style="font-size: 15px; font-weight: 500; fill: #EEF2F6">eventguard.events</text>
  <text x="504" y="975">3 partitions · key = eventId · 1 broker</text>

  <!-- Consumer pipeline -->
  <rect class="card-ev" x="88.5" y="1128.5" width="735" height="199" rx="12"/>
  <text x="112" y="1178"><tspan class="h">processEvent()</tspan><tspan class="mu" dx="12">Kafka consumer group eventguard-workers</tspan></text>
  <circle class="badge" cx="122" cy="1195" r="10"/><text x="122" y="1199" class="bt">4</text>
  <text x="140" y="1199">Redis completed cache: hit → log DUPLICATE and skip</text>
  <circle class="badge" cx="122" cy="1217" r="10"/><text x="122" y="1221" class="bt">5</text>
  <text x="140" y="1221">Redis lock <tspan class="m c">SET NX EX 30</tspan>: Redis down → rethrow, Kafka offset not committed</text>
  <circle class="badge" cx="122" cy="1239" r="10"/><text x="122" y="1243" class="bt">6</text>
  <text x="140" y="1243">Atomic claim: one conditional UPDATE + lease + fencing token</text>
  <circle class="badge" cx="122" cy="1261" r="10"/><text x="122" y="1265" class="bt">7</text>
  <text x="140" y="1265">Fenced tx: COMPLETED + ledger (<tspan class="m c">eventId</tspan> UNIQUE) + balance</text>
  <text x="112" y="1287" class="mu">then cached 24 h · lock released · /metrics on :9464</text>

  <!-- PostgreSQL -->
  <rect class="card" x="1000.5" y="424.5" width="223" height="775" rx="12"/>
  <text x="1024" y="608" class="h">PostgreSQL 16</text>
  <text x="1024" y="629" class="mu">source of truth · unique keys</text>
  <text x="1024" y="673" class="m c">events</text>
  <text x="1024" y="695" class="m k">eventId</text>
  <circle class="badge" cx="1092" cy="691" r="10"/><text x="1092" y="695" class="bt">1</text>
  <text x="1024" y="739" class="m c">outbox_events</text>
  <text x="1024" y="761" class="m k">eventId</text>
  <text x="1024" y="805" class="m c">payments</text>
  <text x="1024" y="827" class="m k">razorpayPaymentId</text>
  <circle class="badge" cx="1164" cy="823" r="10"/><text x="1164" y="827" class="bt">2</text>
  <text x="1024" y="871" class="m c">webhook_events</text>
  <text x="1024" y="893" class="m k">razorpayEventId</text>
  <circle class="badge" cx="1150" cy="889" r="10"/><text x="1150" y="893" class="bt">3</text>
  <text x="1024" y="937" class="m c">wallet_transactions</text>
  <text x="1024" y="959" class="m k">eventId</text>
  <circle class="badge" cx="1092" cy="955" r="10"/><text x="1092" y="959" class="bt">7</text>
  <text x="1024" y="1003" class="m c">wallets · event_logs</text>
  <text x="1024" y="1025" class="m c">dead_letter_events</text>
  <text x="1024" y="1069" class="mu">CHECK amount &gt; 0</text>
  <text x="1024" y="1091" class="mu">CHECK balance ≥ 0</text>

  <!-- Redis -->
  <rect class="card" x="1000.5" y="1248.5" width="223" height="79" rx="12"/>
  <text x="1024" y="1282" class="h">Redis 7</text>
  <text x="1024" y="1303">locks · completed cache</text>

  <!-- Title -->
  <text x="64" y="94" style="font-size: 32px; font-weight: 600; letter-spacing: -0.3px; fill: #EEF2F6">EventGuard</text>
  <text x="64" y="125" style="font-size: 16px; fill: #9FAABA">Idempotent event processing: exactly-once business effects despite at-least-once delivery</text>

  <!-- Zone labels -->
  <text x="88" y="196" class="zl">CLIENTS</text>
  <text x="88" y="404" class="zl">API PROCESS</text>
  <text x="480" y="892" class="zl">KAFKA</text>
  <text x="88" y="1108" class="zl">CONSUMER</text>
  <text x="1000" y="404" class="zl">DATA STORES</text>

  <!-- Arrow labels -->
  <text x="204" y="368" class="al">REST · /api/*</text>
  <text x="468" y="368" class="al">POST /payments/verify</text>
  <text x="732" y="368" class="al">POST /webhooks/razorpay</text>
  <text x="912" y="472" class="al" text-anchor="middle">Event + Outbox</text>
  <text x="912" y="488" class="al" text-anchor="middle">one transaction</text>
  <text x="912" y="669" class="al" text-anchor="middle">poll PENDING</text>
  <text x="912" y="763" class="al" text-anchor="middle">mark PUBLISHED</text>
  <text x="664" y="856" class="al">publish · key = eventId</text>
  <text x="664" y="1072" class="al">consume · at-least-once</text>
  <text x="191" y="964" class="af" text-anchor="end">on failure</text>
  <text x="329" y="964" class="af">re-run when due</text>
  <text x="912" y="1136" class="al" text-anchor="middle">claim → credit</text>
  <text x="912" y="1152" class="al" text-anchor="middle">→ COMPLETED</text>
  <text x="912" y="1272" class="al" text-anchor="middle">lock · cache</text>

  <!-- Legend -->
  <path class="ac" d="M 88 1424 L 132 1424" marker-end="url(#hc)"/>
  <text x="148" y="1428" class="al">async event path</text>
  <path class="an" d="M 300 1424 L 344 1424" marker-end="url(#hn)"/>
  <text x="360" y="1428" class="al">request · database I/O</text>
  <path class="ar" d="M 560 1424 L 604 1424" marker-end="url(#hr)"/>
  <text x="620" y="1428" class="al">failure → retry</text>
  <circle class="badge" cx="782" cy="1424" r="10"/><text x="782" y="1428" class="bt">1</text>
  <text x="804" y="1428" class="al">idempotency guard</text>
  <text x="968" y="1420" class="k" style="font-size: 13px">API and consumer: two processes, each</text>
  <text x="968" y="1436" class="k" style="font-size: 13px">exporting Prometheus metrics</text>
</svg>
