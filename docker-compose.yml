services:
  postgres:
    image: postgres:16-alpine
    container_name: eventguard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventguard}
      POSTGRES_DB: ${POSTGRES_DB:-eventguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-eventguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventguard

  redis:
    image: redis:7-alpine
    container_name: eventguard-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventguard

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eventguard-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      - zookeeper
    healthcheck:
      # The probe starts a JVM; on a loaded host that alone can exceed 10 s and mark a
      # healthy broker unhealthy, which blocks `depends_on: service_healthy` for the backend.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 40s
      retries: 10
      start_period: 60s
    networks:
      - eventguard

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eventguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventguard

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eventguard-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-eventguard}:${POSTGRES_PASSWORD:-eventguard}@postgres:5432/${POSTGRES_DB:-eventguard}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      BACKEND_PORT: 3001
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_TEST_MODE: ${RAZORPAY_TEST_MODE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      # Dev-only defaults; the backend refuses to start with these in production
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      AUTH_DEMO_LOGIN: ${AUTH_DEMO_LOGIN:-true}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - eventguard
    volumes:
      - ./backend/src:/app/backend/src

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: eventguard-frontend
    environment:
      VITE_API_URL: http://localhost:3001
      BACKEND_URL: http://backend:3001
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - eventguard
    volumes:
      - ./frontend/src:/app/frontend/src

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  eventguard:
    driver: bridge
