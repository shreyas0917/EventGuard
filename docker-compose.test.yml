# Disposable infrastructure for integration and failure-injection tests.
#
# A separate Compose project with its own ports and no named volumes: Postgres keeps its
# data in tmpfs, so nothing here can touch the development stack or its volumes.
# Failure tests pause/unpause these containers to simulate outages.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   cd backend && npm run test:integration
#   docker compose -f docker-compose.test.yml down
name: eventguard-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventguard
      POSTGRES_PASSWORD: eventguard
      POSTGRES_DB: eventguard_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventguard -d eventguard_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Single-node KRaft broker (no ZooKeeper). INTERNAL is for in-container tooling,
  # EXTERNAL is what tests on the host connect to.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "59092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:19092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      # JVM-based probe; generous timeout so a loaded host does not report a false "unhealthy"
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 5s
      timeout: 40s
      retries: 30
      start_period: 60s
